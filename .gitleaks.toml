# Конфигурация поиска секретов в содержимом файлов и в истории репозитория.
#
# Проверка по именам файлов (отдельный шаг CI) ловит только `.env` и дампы.
# Этот сканер смотрит именно содержимое: ключи, токены, приватные ключи, строки
# подключения с паролями — в том числе в уже сделанных коммитах.
#
# Версия gitleaks закреплена в .github/workflows/ci.yml вместе с контрольной суммой.

title = "flowers-logistics"

[extend]
# Базовый набор правил gitleaks. Свои правила добавляются сверху, а не вместо него.
useDefault = true

[allowlist]
description = """
Разрешены только значения локального окружения разработки и заведомо поддельные
значения из тестов. Список намеренно узкий: разрешаются конкретные строки,
а не файлы целиком, чтобы настоящий секрет в тех же файлах всё равно был найден.
"""

regexes = [
  # Пароль локальной базы разработки. Задан в docker-compose.yml, используется
  # только внутри compose-сети на машине разработчика. К staging и production
  # отношения не имеет: у них отдельные серверы, базы и секреты.
  '''fl_local_dev_password''',
  # Пароль базы в CI: временный контейнер, живёт минуты, наружу не выставлен.
  '''fl_ci_password''',
  # Заведомо поддельные значения в критических тестах редакции логов.
  # Тесты проверяют, что такие строки НЕ попадают в лог.
  '''sup3r-s3cret''',
  # Поддельные JWT из тестов — только целиком, с якорями начала и конца.
  # Выражение по одному лишь заголовку (eyJhbGciOiJIUzI1NiJ9.) разрешало бы
  # ЛЮБОЙ токен HS256, то есть отключало бы поиск JWT целиком.
  # Проверено на gitleaks 8.30.1: при якорном выражении посторонний JWT
  # того же формата по-прежнему обнаруживается.
  '''^eyJhbGciOiJIUzI1NiJ9\.payload\.signature$''',
  '''^eyJhbGciOiJIUzI1NiJ9\.cGF5bG9hZA\.c2ln$''',
]
