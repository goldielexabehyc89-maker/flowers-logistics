name: CI

on:
  # Ручной запуск без параметров: нужен, когда событие push или pull_request
  # потерялось во время аварии GitHub Actions и прогон не был создан вовсе.
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

# Права по умолчанию — только чтение репозитория.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24.19.0'

jobs:
  checks:
    name: Обязательные проверки
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fl_app
          POSTGRES_PASSWORD: fl_ci_password
          POSTGRES_DB: fl_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fl_app -d fl_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://fl_app:fl_ci_password@localhost:5432/fl_ci?schema=public
      # Разрушающие критические тесты допускаются только к одноразовой базе.
      # В CI это контейнер, живущий время сборки; базы разработки здесь нет.
      TEST_DATABASE_URL: postgresql://fl_app:fl_ci_password@localhost:5432/fl_ci?schema=public
      APP_ENV: local
      TZ: Europe/Moscow
      # Фиксированные тестовые секреты. Значения заведомо непригодны для реальных
      # окружений: у staging и production собственные секреты вне репозитория.
      AUTH_ACCESS_TOKEN_SECRET: ci-only-access-token-secret-000000000000
      AUTH_PIN_PEPPER: ci-only-pin-pepper-0000000000000000000000
      # 32 байта в base64 — ключ AES-256-GCM, тоже только для CI.
      AUTH_REFRESH_REPLAY_KEY: Y2ktb25seS1rZXktMzItYnl0ZXMtMDAwMDAwMDAwMC0=

    steps:
      - uses: actions/checkout@v4

      - name: Установить Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Проверить, что версия Node совпадает с .nvmrc
        run: |
          set -euo pipefail
          expected="$(tr -d '[:space:]' < .nvmrc)"
          actual="$(node -v | sed 's/^v//')"
          if [ "$expected" != "$actual" ]; then
            echo "Версия Node ($actual) не совпадает с .nvmrc ($expected)" >&2
            exit 1
          fi

      - name: Установить зависимости
        run: npm ci --no-audit --no-fund

      - name: Сгенерировать клиент Prisma
        run: npx prisma generate

      - name: Применить миграции на чистой PostgreSQL 16
        run: npx prisma migrate deploy

      - name: Проверить отсутствие дрейфа схемы
        run: npx prisma migrate status

      - name: Типы
        run: npm run typecheck

      - name: Линтер
        run: npm run lint

      - name: Форматирование
        run: npm run format

      - name: Критические проверки
        run: npm run test:critical

      - name: Production-сборка
        run: npm run build

      - name: Уязвимости в production-зависимостях
        # Порог high: критические и высокие уязвимости останавливают сборку,
        # шум низкого уровня — нет. Dev-зависимости в рантайм не попадают.
        run: npm audit --omit=dev --audit-level=high

  image:
    name: Production-образ
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      # Публикация в GHCR требует права записи пакетов; в pull_request не используется.
      packages: write

    services:
      # Отдельная одноразовая база: на ней проверяется, что миграции
      # действительно применяются из собранного образа.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fl_app
          POSTGRES_PASSWORD: fl_image_password
          POSTGRES_DB: fl_image
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fl_app -d fl_image"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      IMAGE_LOCAL_TAG: flowers-logistics:ci
      IMAGE_DATABASE_URL: postgresql://fl_app:fl_image_password@127.0.0.1:5432/fl_image?schema=public

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Собрать образ и загрузить его в локальный демон
        uses: docker/build-push-action@v6
        with:
          context: .
          # Публикации здесь нет: сначала образ обязан пройти проверку ниже.
          push: false
          load: true
          tags: ${{ env.IMAGE_LOCAL_TAG }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Применить миграции из образа на чистую PostgreSQL 16
        shell: bash
        run: |
          set -euo pipefail
          # --no-install: если бы Prisma не входила в образ, npx попытался бы
          # скачать её из реестра. Здесь это запрещено — команда должна
          # выполниться исключительно тем, что уже лежит внутри образа.
          docker run --rm --network host \
            -e DATABASE_URL="$IMAGE_DATABASE_URL" \
            "$IMAGE_LOCAL_TAG" \
            npx --no-install prisma migrate deploy

      - name: Проверить операторские команды внутри образа
        shell: bash
        run: |
          set -euo pipefail
          # Команды из документации обязаны работать ВНУТРИ образа: без
          # TS-исходников, без tsx, без devDependencies и без обращения
          # к реестру npm. Токена, реального телефона, файла снимка и живой
          # внешней сети здесь нет намеренно — проверяется, что каждая команда
          # доходит до СВОЕГО безопасного отказа, а не падает на отсутствующем
          # файле среды выполнения.
          run_in_image() {
            docker run --rm --network host \
              -e DATABASE_URL="$IMAGE_DATABASE_URL" \
              -e APP_ENV=local \
              -e APP_ENVIRONMENT_MARKER=local \
              -e AUTH_ACCESS_TOKEN_SECRET=ci-only-access-token-secret-000000000000 \
              -e AUTH_PIN_PEPPER=ci-only-pin-pepper-0000000000000000000000 \
              -e AUTH_REFRESH_REPLAY_KEY=Y2ktb25seS1rZXktMzItYnl0ZXMtMDAwMDAwMDAwMC0= \
              "$IMAGE_LOCAL_TAG" \
              npm run --silent "$1" 2>&1
          }

          check() {
            local command="$1" expected_code="$2" expected_text="$3"

            set +e
            output="$(run_in_image "$command")"
            code=$?
            set -e

            echo "--- ${command} (код ${code}) ---"
            echo "$output"

            if printf '%s' "$output" | grep -qiE 'tsx: not found|MODULE_NOT_FOUND|Cannot find module|no such file'; then
              echo "команда ${command} не работает внутри образа: нужен исходник или tsx" >&2
              exit 1
            fi

            if [ -n "$expected_code" ] && [ "$code" != "$expected_code" ]; then
              echo "команда ${command}: ожидался код ${expected_code}, получено ${code}" >&2
              exit 1
            fi

            if [ -n "$expected_text" ] && ! printf '%s' "$output" | grep -qF "$expected_text"; then
              echo "команда ${command}: в выводе нет ожидаемого текста «${expected_text}»" >&2
              exit 1
            fi
          }

          # Штатный отказ по окружению: команда дошла до проверки маркеров.
          check 'moysklad:sync-once' 2 ''
          # Собственная валидация аргументов: пользователь не создаётся,
          # код активации не печатается.
          check 'bootstrap:admin' 1 'Использование: npm run bootstrap:admin'
          # Отказ проверки staging-окружения ДО чтения файла и обращения к БД.
          check 'snapshot:import' 2 ''
          check 'snapshot:retire' 2 ''
          # Пилот без настроенных Valhalla/VROOM отказывает по окружению.
          check 'logistics:pilot' 2 ''

      - name: Запустить приложение из образа и дождаться /ready
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name fl-image-check --network host \
            -e DATABASE_URL="$IMAGE_DATABASE_URL" \
            -e APP_ENV=local \
            -e APP_ENVIRONMENT_MARKER=local \
            -e AUTH_ACCESS_TOKEN_SECRET=ci-only-access-token-secret-000000000000 \
            -e AUTH_PIN_PEPPER=ci-only-pin-pepper-0000000000000000000000 \
            -e AUTH_REFRESH_REPLAY_KEY=Y2ktb25seS1rZXktMzItYnl0ZXMtMDAwMDAwMDAwMC0= \
            "$IMAGE_LOCAL_TAG"

          ready=0
          for _ in $(seq 1 60); do
            if curl -fsS --max-time 2 http://127.0.0.1:3000/ready > /dev/null; then
              ready=1
              break
            fi
            sleep 1
          done

          if [ "$ready" != "1" ]; then
            echo "приложение из образа не ответило на /ready" >&2
            docker logs fl-image-check >&2
            docker rm -f fl-image-check > /dev/null
            exit 1
          fi

          docker rm -f fl-image-check > /dev/null

      - name: Войти в GitHub Container Registry
        # В pull request образ только собирается и проверяется:
        # публикация делается лишь для main.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Опубликовать проверенный образ
        # Публикуется ровно тот образ, который только что прошёл проверку,
        # а не пересобранный. Docker Hub не используется: образ приватный.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          # Только точная версия: тег latest не публикуется, чтобы выкатка
          # всегда указывала на конкретный коммит.
          target="ghcr.io/${GITHUB_REPOSITORY}:${GITHUB_SHA}"
          docker tag "$IMAGE_LOCAL_TAG" "$target"
          docker push "$target"

  e2e:
    name: Браузерный smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fl_app
          POSTGRES_PASSWORD: fl_e2e_password
          POSTGRES_DB: fl_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fl_app -d fl_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    # Браузерные проверки выполняются только в зафиксированном образе Playwright.
    # Версия образа обязана совпадать с версией пакета @playwright/test.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --ipc=host

    env:
      # Отдельная одноразовая база: fl_dev, staging и production недопустимы.
      DATABASE_URL: postgresql://fl_app:fl_e2e_password@postgres:5432/fl_e2e?schema=public
      APP_ENV: local
      APP_ENVIRONMENT_MARKER: local
      TZ: Europe/Moscow
      AUTH_ACCESS_TOKEN_SECRET: ci-only-access-token-secret-000000000000
      AUTH_PIN_PEPPER: ci-only-pin-pepper-0000000000000000000000
      AUTH_REFRESH_REPLAY_KEY: Y2ktb25seS1rZXktMzItYnl0ZXMtMDAwMDAwMDAwMC0=
      E2E_ADMIN_PHONE: '+79990000001'
      # Подменные решатель и матрица вместо VROOM и Valhalla: браузерная проверка
      # обязана идти через настоящий серверный контракт, а не подменять
      # HTTP-ответ в браузере. Настоящий расчёт требует дорожного графа
      # и отдельных сервисов, которых здесь нет. Конфигурация не позволяет
      # включить это вне APP_ENV=local.
      PLANNING_TEST_SOLVER: 'true'
      # Подменённый HTTP подсказок вместо живой DaData: ключа в проверках нет
      # и быть не должно, а контракт подсказок обязан проверяться настоящий.
      DADATA_TEST_SUGGESTIONS: 'true'
      # Подменённый транспорт маршрутизатора вместо живой Valhalla: дорожного
      # графа в проверке нет, а линия маршрута обязана проверяться. Клиент,
      # разбор геометрии и контракт при этом настоящие. Конфигурация не
      # позволяет включить это вне APP_ENV=local.
      VALHALLA_TEST_ROUTE: 'true'
      # Вход, воспроизводящий ВНЕШНИЙ сигнал отмены из МоегоСклада. В
      # интерфейсе его вызвать нечем, а без него браузерный сценарий отмены
      # не существует. Конфигурация допускает флаг только при APP_ENV=local.
      E2E_TEST_HOOKS: 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Установить зависимости
        run: npm ci --no-audit --no-fund

      - name: Подготовить базу и сборку
        shell: bash
        run: |
          set -euo pipefail
          npx prisma generate
          npx prisma migrate deploy
          npm run build

      - name: Создать первого администратора
        id: bootstrap
        shell: bash
        run: |
          set -euo pipefail
          # Код нужен тесту, но не должен попасть в журнал сборки.
          output="$(npm run --silent bootstrap:admin -- --phone "$E2E_ADMIN_PHONE" --name "Администратор проверки")"
          code="$(printf '%s' "$output" | sed -n 's/.*код:[[:space:]]*\([0-9]\{4\}\).*/\1/p' | head -1)"
          if [ -z "$code" ]; then
            echo "не удалось получить одноразовый код" >&2
            exit 1
          fi
          echo "::add-mask::$code"
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Подготовить минимальный набор картографических артефактов
        shell: bash
        run: |
          set -euo pipefail
          # Настоящий набор PMTiles весит гигабайты и в CI не скачивается.
          # Генератор создаёт крошечный, но валидный набор без единого
          # сетевого обращения — этого достаточно для контрактных проверок.
          rm -rf "${RUNNER_TEMP}/basemap"
          node tools/geo/make-test-pmtiles.mjs "${RUNNER_TEMP}/basemap"

      - name: Запустить приложение
        shell: bash
        env:
          # NODE_ENV задаётся только процессу приложения: на уровне job он заставил бы
          # npm ci пропустить dev-зависимости, без которых нет сборки и Playwright.
          NODE_ENV: production
        run: |
          set -euo pipefail
          MAP_ARTIFACTS_PATH="${RUNNER_TEMP}/basemap" node apps/api/dist/index.js &
          for _ in $(seq 1 60); do
            if curl -fsS --max-time 2 http://127.0.0.1:3000/ready > /dev/null; then exit 0; fi
            sleep 1
          done
          echo "приложение не поднялось" >&2
          exit 1

      - name: Создать проверочный заказ
        id: seed-order
        shell: bash
        run: |
          set -euo pipefail
          # Заказ создаётся напрямую: токена МоегоСклада в проверках нет,
          # и ни одного сетевого обращения к нему быть не должно.
          # Два заказа: сценарию маршрутов нужен порядок остановок, а он проверяется
          # только там, где остановок хотя бы две.
          output="$(npm run --silent seed:e2e-order -- --count=2)"
          number="$(printf '%s' "$output" | sed -n 's/^номер:[[:space:]]*//p' | sed -n '1p')"
          second="$(printf '%s' "$output" | sed -n 's/^номер:[[:space:]]*//p' | sed -n '2p')"
          if [ -z "$number" ] || [ -z "$second" ]; then
            echo "не удалось создать проверочные заказы" >&2
            exit 1
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "second=$second" >> "$GITHUB_OUTPUT"

      - name: Создать предпосылки расчёта
        id: seed-plan
        shell: bash
        run: |
          set -euo pipefail
          # Только склад, обязательные настройки и заказы дня. Готовое превью
          # НЕ создаётся: браузерная проверка ставит расчёт сама через настоящий
          # /api/route-plans, а готовый запуск удерживал бы день уникальным
          # activeDateKey и не дал бы посчитать по-настоящему.
          output="$(npm run --silent seed:e2e-plan -- --without-run)"
          get() { printf '%s' "$output" | sed -n "s/^$1: //p" | sed -n "$2p"; }

          foreign_number="$(get 'посторонний' 1)"
          number1="$(get 'в маршруте' 1)"
          number2="$(get 'в маршруте' 2)"

          # Сценарий доказывает точность выбора, поэтому неполная фикстура —
          # это отказ сборки, а не повод пропустить проверку.
          for value in "$foreign_number" "$number1" "$number2"; do
            if [ -z "$value" ]; then
              echo "фикстура неполна: браузерной проверке нечем доказывать выбор" >&2
              exit 1
            fi
          done

          {
            echo "selectednumbers=$number1,$number2"
            echo "foreignnumber=$foreign_number"
          } >> "$GITHUB_OUTPUT"

      - name: Создать складскую фикстуру
        id: seed-warehouse
        shell: bash
        run: |
          set -euo pipefail
          # Ячейки, курьер и подтверждённый маршрутный лист: настоящий маршрут
          # требует дорожного графа, которого в браузерной проверке нет.
          output="$(npm run --silent seed:e2e-warehouse)"
          get() { printf '%s' "$output" | sed -n "s/^$1: //p" | sed -n "$2p"; }
          {
            echo "storage=$(get 'ячейка хранения' 1)"
            echo "routecell=$(get 'маршрутная ячейка' 1)"
            echo "route=$(get 'маршрут' 1)"
            echo "order1=$(get 'заказ' 1)"
            echo "order2=$(get 'заказ' 2)"
            echo "courierphone=$(get 'курьер' 1)"
            echo "courierpin=$(get 'пин курьера' 1)"
          } >> "$GITHUB_OUTPUT"

      - name: Создать складскую фикстуру камеры
        id: seed-warehouse-camera
        shell: bash
        run: |
          set -euo pipefail
          # Второй независимый лист с ячейками: сценарий камеры не делит
          # фикстуру с ручным складским сценарием.
          output="$(npm run --silent seed:e2e-warehouse)"
          get() { printf '%s' "$output" | sed -n "s/^$1: //p" | sed -n "$2p"; }
          {
            echo "storage=$(get 'ячейка хранения' 1)"
            echo "routecell=$(get 'маршрутная ячейка' 1)"
            echo "route=$(get 'маршрут' 1)"
            echo "order1=$(get 'заказ' 1)"
            echo "order2=$(get 'заказ' 2)"
          } >> "$GITHUB_OUTPUT"

      - name: Наполнить очередь флориста
        id: seed-florist-queue
        shell: bash
        run: |
          set -euo pipefail
          # Продолжение списка проверяется только там, где заказов больше одной
          # страницы. Заказы производственные и логистической области не видны,
          # поэтому остальные сценарии остаются прежними.
          output="$(npm run --silent seed:e2e-florist-queue -- --count=60)"
          get() { printf '%s' "$output" | sed -n "s/^$1: //p" | sed -n '1p'; }
          {
            echo "prefix=$(get 'префикс')"
            echo "count=$(get 'количество')"
          } >> "$GITHUB_OUTPUT"

      - name: Заказ с полным жизненным циклом
        id: seed-history
        shell: bash
        run: |
          set -euo pipefail
          # Один заказ, прошедший весь путь: импорт, правки, флорист, печать,
          # склад, лист, курьер, недоставка, возврат и решение логиста.
          # Экран «История заказа» без такого заказа проверять нечем.
          output="$(npm run --silent seed:e2e-order-history)"
          get() { printf '%s' "$output" | sed -n "s/^$1: //p" | sed -n 1p; }
          {
            echo "delivered=$(get 'успешная доставка: заказ')"
            echo "deliveredid=$(get 'успешная доставка: id')"
            echo "redelivery=$(get 'повторная доставка: заказ')"
            echo "redeliveryid=$(get 'повторная доставка: id')"
            echo "reassembly=$(get 'пересборка: заказ')"
            echo "reassemblyid=$(get 'пересборка: id')"
            echo "sourcecancel=$(get 'отмена источника: заказ')"
            echo "sourcecancelid=$(get 'отмена источника: id')"
            echo "logistcancel=$(get 'отмена логистом: заказ')"
            echo "logistcancelid=$(get 'отмена логистом: id')"
            echo "writeoff=$(get 'списание: заказ')"
            echo "writeoffid=$(get 'списание: id')"
            echo "florist=$(get 'флорист истории')"
            echo "keeper=$(get 'кладовщик истории')"
            echo "courier=$(get 'курьер истории')"
          } >> "$GITHUB_OUTPUT"

      - name: Создать фикстуру самовывоза
        id: seed-pickup
        shell: bash
        run: |
          set -euo pipefail
          # Заказ со способом получения «Самовывоз» и ячейка хранения: маршрут
          # такому заказу не нужен, а раздел выдачи покупателю без него пуст.
          output="$(npm run --silent seed:e2e-pickup)"
          get() { printf '%s' "$output" | sed -n "s/^$1: //p" | sed -n 1p; }
          {
            echo "order=$(get 'заказ самовывоза')"
            echo "cell=$(get 'ячейка самовывоза')"
            echo "soon=$(get 'ближайший самовывоз')"
            echo "later=$(get 'дальний самовывоз')"
          } >> "$GITHUB_OUTPUT"

      - name: Создать фикстуру возвратов и отмен
        id: seed-returns
        shell: bash
        run: |
          set -euo pipefail
          # Заказы во всех состояниях возврата и отмены сразу: только рядом
          # видно, что задача логиста, обязательство курьера и пометки
          # склада описывают один и тот же букет.
          output="$(npm run --silent seed:e2e-returns)"
          get() { printf '%s' "$output" | sed -n "s/^$1: //p" | sed -n "$2p"; }
          {
            echo "courierphone=$(get 'курьер' 1)"
            echo "courierpin=$(get 'пин курьера' 1)"
            echo "floristphone=$(get 'флорист' 1)"
            echo "floristpin=$(get 'пин флориста' 1)"
            echo "storage=$(get 'ячейка хранения' 1)"
            echo "withcourier=$(get 'у курьера' 1)"
            echo "returning=$(get 'возвращается' 1)"
            echo "accepted=$(get 'принят' 1)"
            echo "cancelledlogist=$(get 'отменён логистом' 1)"
            echo "inroutecell=$(get 'отменён в маршрутной' 1)"
            echo "freecancelled=$(get 'отменён свободный' 1)"
            echo "indraft=$(get 'отменён в черновике' 1)"
            echo "draft=$(get 'черновик' 1)"
          } >> "$GITHUB_OUTPUT"

      - name: Браузерный smoke
        env:
          E2E_BASE_URL: http://127.0.0.1:3000
          E2E_ADMIN_CODE: ${{ steps.bootstrap.outputs.code }}
          E2E_ORDER_NUMBER: ${{ steps.seed-order.outputs.number }}
          E2E_ORDER_NUMBER_2: ${{ steps.seed-order.outputs.second }}
          E2E_FLORIST_QUEUE_PREFIX: ${{ steps.seed-florist-queue.outputs.prefix }}
          E2E_FLORIST_QUEUE_COUNT: ${{ steps.seed-florist-queue.outputs.count }}
          E2E_WH_STORAGE_CELL: ${{ steps.seed-warehouse.outputs.storage }}
          E2E_WH_ROUTE_CELL: ${{ steps.seed-warehouse.outputs.routecell }}
          E2E_WH_ROUTE: ${{ steps.seed-warehouse.outputs.route }}
          E2E_WH_ORDER_1: ${{ steps.seed-warehouse.outputs.order1 }}
          E2E_WH_ORDER_2: ${{ steps.seed-warehouse.outputs.order2 }}
          # Тот же курьер, которому склад выдал маршрут: сценарий доставки
          # продолжает складской, а не заводит второй маршрут.
          E2E_WH_COURIER_PHONE: ${{ steps.seed-warehouse.outputs.courierphone }}
          E2E_WH_COURIER_PIN: ${{ steps.seed-warehouse.outputs.courierpin }}
          # Идентификатор готового превью: сценарий автоматического пути
          # подменяет только старт расчёта, а читает и применяет настоящее.
          E2E_PLAN_SELECTED_NUMBERS: ${{ steps.seed-plan.outputs.selectednumbers }}
          E2E_PLAN_FOREIGN_NUMBER: ${{ steps.seed-plan.outputs.foreignnumber }}
          E2E_RET_COURIER_PHONE: ${{ steps.seed-returns.outputs.courierphone }}
          E2E_RET_COURIER_PIN: ${{ steps.seed-returns.outputs.courierpin }}
          E2E_RET_FLORIST_PHONE: ${{ steps.seed-returns.outputs.floristphone }}
          E2E_RET_FLORIST_PIN: ${{ steps.seed-returns.outputs.floristpin }}
          E2E_RET_STORAGE_CELL: ${{ steps.seed-returns.outputs.storage }}
          E2E_RET_WITH_COURIER: ${{ steps.seed-returns.outputs.withcourier }}
          E2E_RET_RETURNING: ${{ steps.seed-returns.outputs.returning }}
          E2E_RET_ACCEPTED: ${{ steps.seed-returns.outputs.accepted }}
          E2E_RET_CANCELLED_LOGIST: ${{ steps.seed-returns.outputs.cancelledlogist }}
          E2E_RET_IN_ROUTE_CELL: ${{ steps.seed-returns.outputs.inroutecell }}
          E2E_RET_FREE_CANCELLED: ${{ steps.seed-returns.outputs.freecancelled }}
          E2E_RET_IN_DRAFT: ${{ steps.seed-returns.outputs.indraft }}
          E2E_RET_DRAFT: ${{ steps.seed-returns.outputs.draft }}
          E2E_WH_CAM_STORAGE: ${{ steps.seed-warehouse-camera.outputs.storage }}
          E2E_WH_CAM_ROUTE_CELL: ${{ steps.seed-warehouse-camera.outputs.routecell }}
          E2E_WH_CAM_ROUTE: ${{ steps.seed-warehouse-camera.outputs.route }}
          E2E_WH_CAM_ORDER_1: ${{ steps.seed-warehouse-camera.outputs.order1 }}
          E2E_WH_CAM_ORDER_2: ${{ steps.seed-warehouse-camera.outputs.order2 }}
          E2E_PICKUP_ORDER: ${{ steps.seed-pickup.outputs.order }}
          E2E_PICKUP_CELL: ${{ steps.seed-pickup.outputs.cell }}
          E2E_HISTORY_DELIVERED: ${{ steps.seed-history.outputs.delivered }}
          E2E_HISTORY_DELIVERED_ID: ${{ steps.seed-history.outputs.deliveredid }}
          E2E_HISTORY_REDELIVERY: ${{ steps.seed-history.outputs.redelivery }}
          E2E_HISTORY_REDELIVERY_ID: ${{ steps.seed-history.outputs.redeliveryid }}
          E2E_HISTORY_REASSEMBLY: ${{ steps.seed-history.outputs.reassembly }}
          E2E_HISTORY_REASSEMBLY_ID: ${{ steps.seed-history.outputs.reassemblyid }}
          E2E_HISTORY_SOURCE_CANCEL: ${{ steps.seed-history.outputs.sourcecancel }}
          E2E_HISTORY_SOURCE_CANCEL_ID: ${{ steps.seed-history.outputs.sourcecancelid }}
          E2E_HISTORY_LOGIST_CANCEL: ${{ steps.seed-history.outputs.logistcancel }}
          E2E_HISTORY_LOGIST_CANCEL_ID: ${{ steps.seed-history.outputs.logistcancelid }}
          E2E_HISTORY_WRITE_OFF: ${{ steps.seed-history.outputs.writeoff }}
          E2E_HISTORY_WRITE_OFF_ID: ${{ steps.seed-history.outputs.writeoffid }}
          E2E_HISTORY_FLORIST: ${{ steps.seed-history.outputs.florist }}
          E2E_HISTORY_KEEPER: ${{ steps.seed-history.outputs.keeper }}
          E2E_HISTORY_COURIER: ${{ steps.seed-history.outputs.courier }}
          E2E_PICKUP_SOON: ${{ steps.seed-pickup.outputs.soon }}
          E2E_PICKUP_LATER: ${{ steps.seed-pickup.outputs.later }}
        run: npm run test:e2e

      # Playwright сохраняет снимок страницы момента отказа рядом с результатами,
      # но в журнал он не попадает, и отказ приходится разбирать вслепую.
      # Печатается только доступностное дерево: ни трасс, ни файлов cookie,
      # ни заголовков — токенам просочиться неоткуда.
      - name: Показать снимок страницы при отказе
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          found=0
          while IFS= read -r file; do
            found=1
            echo "::group::$file"
            cat "$file"
            echo "::endgroup::"
          done < <(find test-results -name 'error-context.md' -print 2>/dev/null | sort)
          if [ "$found" = "0" ]; then
            echo "снимков страницы нет: отказ произошёл вне браузерной проверки"
          fi

  secrets-scan:
    name: Запрещённые файлы и поиск секретов
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      # Версия и контрольная сумма закреплены: обновление сканера — осознанное действие,
      # а не молчаливое подтягивание нового кода в CI.
      GITLEAKS_VERSION: '8.30.1'
      GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Запретить коммит .env, дампов и картографических архивов
        run: |
          set -euo pipefail
          # Проверка по именам файлов. Содержимое проверяется отдельным шагом ниже.
          # .env.example содержит только имена переменных и разрешён намеренно.
          #
          # Картографические архивы (.pmtiles, .mbtiles, .osm.pbf) весят сотни мегабайт
          # и навсегда остаются в истории Git: раздаются они отдельно, а не репозиторием.
          forbidden="$(git ls-files \
            | grep -E '(^|/)\.env($|\.)|\.dump$|\.sql\.gz$|\.pem$|\.p12$|\.pmtiles$|\.mbtiles$|\.osm\.pbf$|\.pbf$' \
            | grep -v -E '(^|/)\.env\.example$' || true)"
          if [ -n "$forbidden" ]; then
            echo "В репозитории найдены файлы, которые не должны попадать в Git:" >&2
            echo "$forbidden" >&2
            exit 1
          fi

      - name: Установить gitleaks с проверкой контрольной суммы
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL --retry 3 --max-time 120 \
            -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" gitleaks
          chmod +x gitleaks
          ./gitleaks version

      - name: Поиск секретов в содержимом файлов и в истории
        run: |
          set -euo pipefail
          # --redact: найденное значение не печатается в лог CI, чтобы отчёт
          # о секрете сам не стал местом его публикации.
          ./gitleaks detect \
            --source . \
            --config .gitleaks.toml \
            --redact \
            --no-banner \
            --verbose \
            --exit-code 1

  print-agent:
    name: Агент печати (Windows x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Установить Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Агент не имеет зависимостей вовсе: ни одной строки из node_modules.
      # Поэтому сборка не ставит пакеты и не зависит от состояния реестра —
      # только штатный Node и штатный же сборщик одиночного файла.
      - name: Проверить синтаксис агента
        run: node --check agent/src/agent.cjs

      - name: Собрать одиночный исполняемый файл
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location agent
          node --experimental-sea-config sea-config.json
          Copy-Item (Get-Command node).Source -Destination flowers-print-agent.exe
          # postject вшивает собранный blob в копию node.exe. Версия
          # закреплена: обновление сборщика не должно менять артефакт молча.
          npx --yes postject@1.0.0-alpha.6 flowers-print-agent.exe NODE_SEA_BLOB agent.blob `
            --sentinel-fuse NODE_SEA_FUSE_fce680ab2cc467b6e072b8b5df1996b2
          if (-not (Test-Path flowers-print-agent.exe)) { throw 'файл агента не собран' }

      - name: Проверить, что файл запускается
        shell: pwsh
        run: |
          Set-Location agent
          # Без настроек агент обязан СПРОСИТЬ их и завершиться понятной
          # ошибкой. Ненулевой код возврата здесь ожидаем — это и есть та самая
          # понятная ошибка, — поэтому проверяется вывод, а не код.
          $PSNativeCommandUseErrorActionPreference = $false
          $env:AGENT_STATE_DIR = "$env:TEMP\agent-check"
          $output = '' | & .\flowers-print-agent.exe 2>&1 | Out-String
          Write-Host $output
          if ($output -notmatch 'Настройка агента печати') {
            throw "агент не вышел на настройку: $output"
          }
          if ($output -notmatch 'адрес сервера обязателен') {
            throw "агент не назвал причину отказа: $output"
          }

      - name: Приложить артефакт
        uses: actions/upload-artifact@v4
        with:
          name: flowers-print-agent-windows-x64
          path: |
            agent/flowers-print-agent.exe
            agent/install-autostart.ps1
            agent/README.md
          if-no-files-found: error
          retention-days: 30
