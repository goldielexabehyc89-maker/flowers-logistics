name: Legacy print proxy

on:
  pull_request:
    paths:
      - 'deploy/proxy/**'
      - 'deploy/scripts/test-legacy-proxy.mjs'
      - '.github/workflows/legacy-proxy.yml'
  push:
    branches: [main]
    paths:
      - 'deploy/proxy/**'
      - 'deploy/scripts/test-legacy-proxy.mjs'
      - '.github/workflows/legacy-proxy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tls:
    name: Изоляция TLS и совместимость агента Win7
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - name: Caddy той же версии, что на основном сервере
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --max-time 90 \
            https://github.com/caddyserver/caddy/releases/download/v2.11.4/caddy_2.11.4_linux_amd64.tar.gz \
            -o "$RUNNER_TEMP/caddy.tar.gz"
          printf '%s  %s\n' \
            '8220d1f013b6f27510247b2360c9e0ca9f018feebd82515f07635318b34ff9777ccc8fd0b6e6f2486ce3a33fe389fbb7db12d05baa474f4587509fb4f5ebf1c9' \
            "$RUNNER_TEMP/caddy.tar.gz" | sha512sum -c -
          tar -xzf "$RUNNER_TEMP/caddy.tar.gz" -C "$RUNNER_TEMP" caddy
      - name: HTTPS, CBC только на app, запрет подмены IP
        run: CADDY_BIN="$RUNNER_TEMP/caddy" node deploy/scripts/test-legacy-proxy.mjs
