# Compose для серверных окружений.
#
# Файл один и параметризован: имя проекта, внешний порт, файл окружения, том базы
# и маркер окружения приходят из конфигурации выкатки (deploy/private/*.conf).
# Так значение задаётся ровно в одном месте и не может разъехаться между копиями.
#
# Staging и production могут стоять на одном сервере. Изоляция обеспечивается
# разными значениями этих переменных: у окружений разные project name (а значит,
# разные контейнеры и сеть), разные тома, разные файлы окружения и разные внешние
# порты. Совпадение любого из них команда выкатки отвергает до запуска Compose.
#
# Секреты читаются из файла окружения на сервере и в Git не попадают.

name: '${COMPOSE_PROJECT}'

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: ['./${ENV_FILE}']
    environment:
      TZ: Europe/Moscow
      PGTZ: Europe/Moscow
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 20

  app:
    # Репозиторий и версия приходят из конфигурации выкатки. Зашитый здесь адрес
    # разошёлся бы с IMAGE_REPOSITORY: скрипт проверил бы OCI-метку одного образа,
    # а Compose запустил бы другой. Тег latest не используется — только точная версия.
    image: ${IMAGE_REPOSITORY}:${IMAGE_TAG}
    restart: unless-stopped
    env_file: ['./${ENV_FILE}']
    environment:
      APP_ENV: ${APP_ENV_NAME}
      APP_ENVIRONMENT_MARKER: ${APP_ENV_NAME}
      NODE_ENV: production
      TZ: Europe/Moscow
      # Внутренние пути и адреса задаются здесь, а не в файле окружения:
      # они определяются формой этого Compose-файла, а не настройками сервера.
      # Приложение обязано получить их само — иначе подложка окажется
      # «не настроена», а расчёт времени не заработает вовсе.
      MAP_ARTIFACTS_PATH: /srv/basemap
      # Маршрутизатор доступен только внутри сети Compose по имени сервиса.
      VALHALLA_URL: http://valhalla:8002
      # Идентичность дорожного графа — SHA-256 файла tiles.tar. Время изменения
      # файла и tileset_last_modified из /status идентичностью не являются:
      # они меняются от копирования и не меняются от подмены содержимого.
      VALHALLA_GRAPH_SHA256: ${VALHALLA_GRAPH_SHA256}
      # Решатель доступен только по имени сервиса во внутренней сети.
      VROOM_URL: http://vroom:3000
      # Версия закреплённого образа. Возможностью решателя это значение
      # не является: разное время обслуживания по типам транспорта приложение
      # проверяет пробной задачей при старте.
      VROOM_VERSION: ${VROOM_VERSION}
      # Режим «только чтение» контура МоегоСклада (ENV-004). Значение несекретное
      # и потому задаётся конфигурацией окружения, а не файлом секретов: оно
      # доступ не выдаёт, а отнимает. На staging обязано быть true — иначе
      # приложение fail closed откажется стартовать с токеном.
      MOYSKLAD_READ_ONLY: ${MOYSKLAD_READ_ONLY}
    networks:
      # Приложение подключено к ОБЕИМ сетям: к общей — чтобы отвечать наружу
      # через обратный прокси, и к внутренней — чтобы дотянуться до решателя.
      - default
      - solver
    ports:
      # Только петлевой интерфейс: наружу приложение выводится обратным прокси
      # при настройке сервера. Внешний порт свой у каждого окружения.
      - '127.0.0.1:${APP_HOST_PORT}:3000'
    volumes:
      # Картографические артефакты монтируются ТОЛЬКО НА ЧТЕНИЕ и лежат вне
      # образа: PMTiles на регион — сотни мегабайт, которые остались бы
      # в каждом слое. Набор неизменяем: приложение сверяет его с манифестом
      # при старте, а подмена файла под работающим процессом дала бы обрывок
      # вместо тайла.
      - type: bind
        source: ${MAP_ARTIFACTS_DIR}
        target: /srv/basemap
        read_only: true
    depends_on:
      db:
        condition: service_healthy

  # Собственный маршрутизатор.
  #
  # Наружу НЕ публикуется: ни одного проброса портов. Доступен только другим
  # сервисам внутри сети Compose. Маршрутизатор, открытый в интернет, — это
  # чужой бесплатный вычислитель и заодно способ узнать, куда мы возим.
  valhalla:
    image: ${VALHALLA_IMAGE}
    restart: unless-stopped
    # У официального образа нет ни entrypoint, ни cmd: команда обязана быть
    # здесь. Переменные вида use_tiles_ignore_pbf относятся к другому,
    # стороннему образу и в этом не делают ничего — их отсутствие намеренно.
    #
    # Второй аргумент — число рабочих потоков. Сервис только читает готовый
    # граф и ничего не собирает на месте: сборка занимает десятки минут
    # и не должна происходить при перезапуске контейнера.
    command: ['valhalla_service', '/custom_files/valhalla.json', '1']
    environment:
      TZ: Europe/Moscow
    volumes:
      - type: bind
        source: ${VALHALLA_GRAPH_DIR}
        target: /custom_files
        read_only: true
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://127.0.0.1:8002/status > /dev/null || exit 1']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Решатель задачи маршрутизации.
  #
  # `--network none` для него невозможен: приложение обязано отправлять ему
  # HTTP-запросы, и контейнер без сети их не получит. Поэтому изоляция строится
  # иначе — отдельной ВНУТРЕННЕЙ сетью (`internal: true`), из которой нет
  # выхода наружу, и полным отсутствием проброса портов. К этой сети подключены
  # только решатель и приложение.
  #
  # Ни матрицу, ни граф решатель не считает: он получает готовые направленные
  # матрицы и работает по индексам. Маршрутизатор ему не нужен, и обращаться
  # к нему он не будет — из внутренней сети он туда и не дотянется.
  vroom:
    image: ${VROOM_IMAGE}
    restart: unless-stopped
    environment:
      TZ: Europe/Moscow
    networks:
      - solver
    healthcheck:
      # Собственная проверка решателя: он прогоняет маленькую задачу
      # с пользовательской матрицей и отвечает, если решает её.
      test: ['CMD-SHELL', 'curl -fsS http://127.0.0.1:3000/health > /dev/null || exit 1']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

networks:
  # Общая сеть окружения: приложение, база и маршрутизатор.
  default:
  # Сеть решателя. `internal: true` означает, что из неё нет выхода в интернет:
  # даже ошибочно настроенный решатель никуда не сходит.
  solver:
    internal: true

volumes:
  db:
    # Явное имя: тома окружений не должны пересекаться даже на одном сервере.
    name: '${DB_VOLUME}'
