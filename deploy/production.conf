# Конфигурация production.
#
# Шаблон: реальные адреса, отпечатки и секреты сюда не вписываются и в Git
# не попадают. Пока значения остаются CHANGE_ME, обычная выкатка отказывает
# до любого обращения к сети.
#
# Отдельный сервер, отдельная база, отдельные тома, домен и резервные копии.
# Ничего общего со staging.

ENVIRONMENT_MARKER="production"

SSH_HOST="CHANGE_ME_production_host"
SSH_USER="CHANGE_ME_production_user"
SSH_PORT="22"

HOST_FINGERPRINT="CHANGE_ME_production_known_hosts_line"

REMOTE_DIR="/srv/flowers-logistics-production"
APP_DOMAIN="CHANGE_ME_production_domain"
APP_PORT="3000"

IMAGE_REPOSITORY="ghcr.io/goldielexabehyc89-maker/flowers-logistics"

COMPOSE_PROJECT="fl-production"

# --- Подтверждение проверки на staging -----------------------------------
#
# Отдельный хост, отдельный отпечаток и отдельный known_hosts. Список
# проверенных версий читается со staging-сервера: если бы он читался
# с production, тот подтверждал бы выкатку сам себе.

STAGING_SSH_HOST="CHANGE_ME_staging_host"
STAGING_SSH_USER="CHANGE_ME_staging_user"
STAGING_SSH_PORT="22"

STAGING_HOST_FINGERPRINT="CHANGE_ME_staging_known_hosts_line"

STAGING_REMOTE_DIR="/srv/flowers-logistics-staging"

# Файл со списком версий, успешно проверенных на staging.
STAGING_VERIFIED_FILE="/srv/flowers-logistics-staging/state/verified-versions"
