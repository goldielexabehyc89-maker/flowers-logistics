# Compose production. Полностью отдельные сервер, база, тома и домен.
# Секреты читаются из файла окружения на сервере и в Git не попадают.
name: fl-production

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: [./production.env]
    environment:
      TZ: Europe/Moscow
      PGTZ: Europe/Moscow
    volumes:
      - production-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 20

  app:
    # Только точная версия: latest не используется, чтобы выкатка была воспроизводимой.
    image: ghcr.io/goldielexabehyc89-maker/flowers-logistics:${IMAGE_TAG}
    restart: unless-stopped
    env_file: [./production.env]
    environment:
      APP_ENV: production
      APP_ENVIRONMENT_MARKER: production
      NODE_ENV: production
      TZ: Europe/Moscow
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      db:
        condition: service_healthy

volumes:
  production-db:
